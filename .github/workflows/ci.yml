name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff

      - name: Code Compilation Check
        run: |
          python -m compileall backend/app
          python -m compileall backend/tests

      - name: Lint Check (Ruff)
        run: |
          # Check for errors and critical warnings
          ruff check backend/app backend/tests --select E9,F63,F7,F82 --exit-non-zero-on-fix || exit 1

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          SUPABASE_URL: https://mock-supabase.example.com
          SUPABASE_KEY: mock_ci_key
          SUPABASE_SERVICE_ROLE_KEY: mock_ci_service_key
          SUPABASE_JWT_SECRET: mock_jwt_secret
          INTERNAL_SERVICE_TOKEN: kalaswar_internal_service_secret_token
          CHAIN_ADAPTER_TYPE: mock
        run: |
          cd backend
          python -m pytest tests/ -v

  web-build:
    name: Web Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (>=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: https://api.kalaswar.org
          NODE_ENV: production
        run: |
          cd web
          npm run build
